url: ~
template:
  bootstrap: 5

reference:
  - title: Matching and duplicates
    desc: >
      Drop-in replacements for base R functions. Inputs that are too small
      or have non-standard types fall back to base R.
  - subtitle: Matching
    contents:
      - par_match
      - par_match_rows
      - par_match_all
      - par_find_interval
  - subtitle: Duplicates and sets
    contents:
      - par_duplicated
      - par_union
  - subtitle: Factors, dates, ranks, and sums
    contents:
      - par_factor
      - par_as_date
      - par_rank
      - par_rowsum
      - par_approx
  - title: String operations
    desc: >
      Not exact base R equivalents. Threads read the strings straight from
      R's memory.
  - subtitle: Regular expressions
    desc: Rust's regex syntax, not R's.
    contents:
      - par_detect
      - par_extract
  - subtitle: Dictionary lookup
    desc: Many literal terms at once, in one pass per string.
    contents:
      - par_match_term
      - par_replace_term

articles:
  - title: Articles
    navbar: ~
    contents:
      - articles/use-cases
      - articles/performance
